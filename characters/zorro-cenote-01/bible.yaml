  description: 'Zorro original para un juego 2D de aventura: criatura pequeña y ágil
    de perfil legible, pelaje terracota quemado con pecho y punta de cola jade pálido,
    máscara facial marfil, orejas grandes con interior turquesa apagado y una pequeña
