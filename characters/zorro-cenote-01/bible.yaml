  - four-legged compact body with a slightly oversized head
  - two tall ears with muted turquoise inner ears
  - pale jade chest and pale jade tail tip
  - small obsidian crescent mark above the visible eye
  - dark indigo pixel outline and readable paws
  optional_features:
  - a single tiny jade bead at the neck may appear only if it does not break the silhouette
