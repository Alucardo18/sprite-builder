  silhouette_notes: 'Side-facing game sprite with a compact torso, lifted brush tail, upright ears,
    and a clear four-paw read. Keep the body anchor stable across all frames.'
  lighting: 'Simple warm key light from upper left with one darker underside band; flat pixel clusters.'
  outline: 'One-to-two pixel dark indigo outline, with selective interior dark accents and no black halo.'
